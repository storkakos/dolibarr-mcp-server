# Dolibarr MCP server.
#   cp .env.example .env    # set DOLIBARR_URL, DOLIBARR_OAUTH_ISSUER and MCP_RESOURCE_URL
#   docker compose up -d --build
# Variables in ${...} below are read from .env (or the shell) by docker compose itself.
services:
  dolibarr-mcp-server:
    build: .
    # Keep this tag equal to __version__ in src/dolibarr_mcp_server/__init__.py (checked by tests/test_container_files.py).
    image: dolibarr-mcp-server:0.1.1
    # Always .env for normal use. MCP_ENV_FILE exists only so scripts/smoke-test.sh can run with its
    # own env file; it is not an operator setting. It only changes what the container sees: host-side
    # values in ${...} here (MCP_PUBLISH_PORT, MCP_LOG_DIR) are never read from that file, only
    # from .env next to this compose file or the shell.
    env_file: ${MCP_ENV_FILE:-.env}
    environment:
      # Fixed inside the container; change the host side with MCP_PUBLISH_PORT.
      # The audit log uses its default /data/logs/mcp-dolibarr-audit.log, i.e. the mounted folder.
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8131"
    ports:
      # Loopback only: your reverse proxy terminates TLS and forwards to this port.
      - "127.0.0.1:${MCP_PUBLISH_PORT:-8131}:8131"
    volumes:
      - ${MCP_LOG_DIR:-./logs}:/data/logs
      # Internal CA (only if Dolibarr's certificate comes from your own certificate authority):
      # mount the CA bundle (PEM) read-only and set SSL_CERT_FILE=/etc/dolibarr-mcp/ca.pem in .env.
      # Certificate verification stays on. The file must be readable by UID 10001 (e.g. mode 644).
      # To keep compose.yaml unchanged for `git pull`, put this line into a compose.override.yaml.
      # - ./certs/internal-ca.pem:/etc/dolibarr-mcp/ca.pem:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
