# TEST ONLY. LibreChat v0.8.9 config of the test stack: the snippets of
# docs/setup/example-keycloak-librechat.md, plus one AI model (not part of the example setup).
version: 1.3.19

# --- Your LLM endpoint (not part of the example setup). The example uses OpenRouter with
# OPENROUTER_KEY from llm.env and its free route openrouter/free (OpenRouter picks a free model that
# supports the request's tool calls). For another provider or model, change this block, the key name
# in llm.env and the preset below. Use a model that supports tool calls.
endpoints:
  custom:
    - name: OpenRouter
      apiKey: "${OPENROUTER_KEY}"
      baseURL: https://openrouter.ai/api/v1
      models:
        default: ["openrouter/free"]
        fetch: false
      titleConvo: false

# --- From the example setup, section "librechat.yaml: the Dolibarr MCP server"
mcpServers:
  dolibarr:
    type: streamable-http
    # Exactly the MCP server's MCP_RESOURCE_URL.
    url: https://mcp.example.com/mcp
    title: Dolibarr
    description: Third parties, invoices, proposals, orders and products from Dolibarr, with your own Dolibarr rights
    # Every user connects with their own Dolibarr account.
    requiresOAuth: true

mcpSettings:
  allowedDomains:
    - "https://mcp.example.com"
    - "https://erp.example.com"

# With the option "Dolibarr assistant preselected" (prioritize, enforce, default).
modelSpecs:
  prioritize: true
  enforce: false
  list:
    - name: dolibarr-assistant
      default: true
      label: Dolibarr assistant
      description: Answers questions about Dolibarr with your own Dolibarr rights
      preset:
        # Your endpoint and model (see above).
        endpoint: OpenRouter
        model: openrouter/free
      mcpServers:
        - dolibarr
